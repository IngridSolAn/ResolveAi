services:
  # --- BANCO DE DADOS DO GLPI ---
  db:
    image: mariadb:10.11
    container_name: glpi-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password_aqui
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi_user_aqui
      MYSQL_PASSWORD: senha_user_aqui
    volumes:
      - glpi_db_data:/var/lib/mysql
    restart: always
    networks:
      - resolveai-net

  # --- APLICATIVO GLPI ---
  glpi:
    image: diouxx/glpi:latest
    container_name: glpi-app
    ports:
      - "1201:80"
    environment:
      - DB_HOST=db
      - DB_NAME=glpi
      - DB_USER=glpi_user_aqui
      - DB_PASSWORD=senha_user_aqui
      - RESOLVEAI_API_URL=http://backend-ai:8000/analyze
      - RESOLVEAI_API_TOKEN=${RESOLVEAI_API_TOKEN:-}
      - RESOLVEAI_API_TIMEOUT=${RESOLVEAI_API_TIMEOUT:-300}
    volumes:
      - glpi_app_data:/var/www/html
      - ./glpi/plugins/resolveai:/var/www/html/glpi/plugins/resolveai
    restart: always
    depends_on:
      - db
      - backend-ai
    networks:
      - resolveai-net

  # --- BACKEND DA IA ---
  backend-ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resolveai-backend
    ports:
      - "8002:8000"
    environment:
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - RESOLVEAI_API_TOKEN=${RESOLVEAI_API_TOKEN:-}
      # IA: ollama (gratuita, padrão) | claude (paga) | offline
      - RESOLVEAI_LLM=${RESOLVEAI_LLM:-ollama}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-300}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-5-5}
      - CLAUDE_EFFORT=${CLAUDE_EFFORT:-medium}
    volumes:
      # Cache do modelo de embeddings do Chroma (~80 MB), baixado uma vez.
      - backend_cache:/root/.cache
    depends_on:
      - chromadb
      - ollama
    restart: always
    networks:
      - resolveai-net

  # --- BANCO VETORIAL CHROMADB (PARA A IA) ---
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb-app
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: always
    networks:
      - resolveai-net

  # --- IA LOCAL GRATUITA (OLLAMA) ---
  # Baixe o modelo uma vez: docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-app
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    networks:
      - resolveai-net

volumes:
  glpi_db_data:
  glpi_app_data:
  chroma_data:
  ollama_data:
  backend_cache:

networks:
  resolveai-net:
    driver: bridge
